name: Build and release

# Push a tag like v1.0.1 and this builds Fletch on all three platforms and
# attaches the installers to a GitHub Release. The macOS build has to happen on
# a macOS runner — Apple's packaging tools do not run anywhere else — which is
# why this exists rather than building everything on one machine.

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # or run it by hand from the Actions tab

permissions:
  contents: write             # needed to create the release and upload to it

jobs:
  build:
    name: Build ${{ matrix.label }}
    # The suites run inside each platform's own job rather than once on Linux.
    # A platform-specific test failure then blocks only that platform's
    # installer, instead of holding up the other two.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: macos-latest
            label: macOS
            # zip only in the main step. A .app in a zip always packages
            # cleanly; building a .dmg needs hdiutil and is the part that has
            # been failing, so it is attempted separately and allowed to fail
            # rather than taking the whole macOS build down with it.
            buildArgs: --mac zip
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - os: ubuntu-latest
            label: Linux
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # continue-on-error so a red suite still produces an installer people can
      # try. The job is failed deliberately at the end, after the upload, so a
      # failure is never silently swallowed.
      - name: Run the offline suites
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Show what failed
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Test failure on ${{ matrix.label }}"
            echo '```'
            tail -80 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept alongside the installer so the failure can be read without a token.
      - name: Keep the test output
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.label }}
          path: test-output.txt
          retention-days: 14

      - name: Draw the icon set
        run: npm run icons

      - name: Build
        id: pack
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.buildArgs }} --publish never 2>&1 | tee build-output.txt
        env:
          # No Apple certificate, so skip notarisation rather than fail on it.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Nice to have, not worth losing the release over.
      - name: Also try a macOS .dmg
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        shell: bash
        run: npx electron-builder --mac dmg --publish never 2>&1 | tee -a build-output.txt
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Show why the build failed
        if: failure() && steps.pack.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Build failure on ${{ matrix.label }}"
            echo '```'
            tail -60 build-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.label }}
          path: build-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Package the browser extension
        if: matrix.os == 'windows-latest'
        run: npm run pack:extension

      - uses: actions/upload-artifact@v4
        with:
          name: fletch-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 14

      # Now that the installer is safely uploaded, make the failure count.
      - name: Fail if the suites did not pass
        if: steps.tests.outcome == 'failure'
        run: |
          echo "The build is published, but the test suites failed on ${{ matrix.label }}."
          exit 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # always(): publish whatever did build. One platform failing should not
    # deny everyone else an installer.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect the installers
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp {} out/ \;
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: false
          generate_release_notes: true
          body: |
            ## Installing

            | Platform | File |
            |---|---|
            | **Windows** | `Fletch-Setup-*.exe` — installs to Program Files. SmartScreen will warn, because the build is unsigned: **More info → Run anyway**. |
            | **Windows, no install** | `Fletch-Portable-*.exe` — runs as-is. |
            | **macOS (Apple silicon)** | `Fletch-*-arm64.dmg` |
            | **macOS (Intel)** | `Fletch-*-x64.dmg` |
            | **Linux** | `Fletch-*.AppImage` or `Fletch-*.deb` |

            macOS builds are unsigned, so the first launch needs
            **right-click → Open**, or *System Settings → Privacy & Security → Open Anyway*.

            After installing, open Fletch and follow the on-screen panel to add
            the browser extension.
