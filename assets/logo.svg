<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" width="248" height="64" role="img" aria-label="Fletch">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="0.55" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#FF5F3D"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#ember)"/>

  <!-- Fletching: three tapering vanes that read as both feather barbs and a download arrow -->
  <g fill="none" stroke="#1A1005" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M13 18 L32 30 L51 18"/>
    <path d="M19 30 L32 40 L45 30"/>
    <path d="M25 41 L32 48 L39 41"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="43" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
        font-size="32" font-weight="650" letter-spacing="-0.6" fill="#F4F6FA">Fletch</text>
</svg>
